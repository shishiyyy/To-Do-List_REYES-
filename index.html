<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Todo List</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<div class="todo-box">

<h1>Todo List</h1>

<div class="add-form">

<input
type="text"
id="taskInput"
placeholder="What needs to be done?"
>

<input
type="number"
id="hoursInput"
value="0"
min="0"
>

<button class="add-btn" onclick="addTask()">
Add
</button>

</div>

<div class="filters">

<div>
<button class="filter-btn active"
onclick="filterTasks('all', this)">
All
</button>

<button class="filter-btn"
onclick="filterTasks('active', this)">
Active
</button>

<button class="filter-btn"
onclick="filterTasks('completed', this)">
Completed
</button>
</div>

<button class="link-btn" onclick="markAllDone()">
Mark all done
</button>

</div>

<div id="taskList"></div>

<div class="footer">

<span id="taskCount">
0 items left · 0 hours total
</span>

<button class="link-btn" onclick="clearCompleted()">
Clear completed
</button>

</div>

<p class="hint">
Easy: up to 2h · Medium: over 2h · Hard: over 5h.
<br>
Double-click a task to edit its text.
Double-click its label to edit hours.
<br>
Press Enter to save and Escape to cancel.
</p>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
